<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>서비스 일시 중단 안내 · MACHINE IQ</title>
<link rel="icon" href="favicon.ico"/>
<!--
  MACHINE IQ 서비스 일시 중단 안내 페이지 (운영계 테스트·작업 기간에 일반 사용자에게 보여 주는 화면)
  - 이 폴더(index.html, logo.svg, favicon.ico)만 있으면 단독으로 동작합니다. 다른 파일을 불러오지 않습니다.
  - 문구는 아래 <script>의 TEXT 값(한국어 ko / English en)에서 바꿉니다. 중단 기간·문의처는 정해지지 않아 넣지 않았습니다.
  - 서버에서 중단 기간 동안 모든 요청을 이 페이지로 보낼 때는 HTTP 503 상태와 Retry-After 헤더를 함께 보내는 것을 권장합니다
    (검색엔진·앱이 '일시 중단'으로 인식). 이 페이지 자체는 상태 코드를 바꿀 수 없습니다.
-->
<style>
  :root { --brand: #ff360d; --ink: #111; --body: #333; --mute: #6b7280; --line: #e5e7eb; --soft: #f7f7f8; --bg: #f4f5f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--body);
    font: 400 15px/1.6 "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", Arial, sans-serif; word-break: keep-all; }
  .top { display: flex; align-items: center; height: 64px; padding: 0 32px; background: var(--brand); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.08); }
  .top img { width: 235px; height: 50px; object-fit: contain; object-position: left center; }
  .lang { margin-left: auto; display: inline-flex; border: 1px solid rgba(255,255,255,.6); border-radius: 6px; overflow: hidden; }
  .lang button { height: 34px; min-width: 56px; padding: 0 12px; border: 0; background: transparent; color: #fff; font: 600 13px/1 inherit; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--brand); }
  .lang button:focus-visible { outline: 3px solid rgba(255,255,255,.7); outline-offset: -3px; }
  main { flex: 1; display: flex; justify-content: center; padding: 48px 16px 40px; }
  .card { width: 100%; max-width: 640px; height: fit-content; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 40px; box-shadow: 0 6px 24px rgba(15,23,42,.06); }
  .icon { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff1ec; color: var(--brand); margin: 0 0 20px; }
  .icon svg { width: 32px; height: 32px; }
  h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.35; font-weight: 700; color: var(--ink); }
  .lead { margin: 0 0 24px; font-size: 15px; color: var(--body); }
  .info { margin: 0 0 16px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .info > div { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 14px 18px; }
  .info dt { color: var(--mute); font-size: 14px; }
  .info dd { margin: 0; color: var(--ink); font-weight: 600; }
  .note { margin: 0; padding: 14px 18px; border-radius: 8px; background: var(--soft); font-size: 14px; color: var(--body); }
  footer { padding: 20px 16px 28px; text-align: center; color: #9aa1ab; font-size: 12px; }
  @media (max-width: 640px) {
    .top { height: 56px; padding: 0 16px; }
    .top img { width: 170px; height: 40px; }
    main { padding: 24px 16px 28px; }
    .card { padding: 28px 20px 24px; border-radius: 10px; }
    h1 { font-size: 22px; }
    .info > div { grid-template-columns: 1fr; gap: 2px; padding: 12px 14px; }
  }
</style>
</head>
<body>
<header class="top">
  <img src="logo.svg" alt="Bobcat MACHINE IQ MATERIAL HANDLING"/>
  <div class="lang" role="group" aria-label="언어 선택 / Language">
    <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
  </div>
</header>

<main>
  <section class="card" aria-labelledby="title">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>
    </div>
    <h1 id="title" data-t="title"></h1>
    <p class="lead" data-t="lead"></p>

    <dl class="info">
      <div><dt data-t="scopeLabel"></dt><dd data-t="scope"></dd></div>
    </dl>

    <p class="note" data-t="note"></p>
  </section>
</main>

<footer>©2024 Bobcat Company. ALL RIGHTS RESERVED.</footer>

<script>
  // 화면 문구 (한국어 / English)
  var TEXT = {
    ko: {
      title: '서비스를 일시적으로 중단합니다',
      lead: 'MACHINE IQ 서비스를 한시적으로 중단합니다. 중단 기간에는 서비스를 이용할 수 없습니다. 이용에 불편을 드려 죄송합니다.',
      scopeLabel: '중단 대상', scope: 'MACHINE IQ 웹',
      note: '서비스가 재개되면 별도 조치 없이 다시 로그인해 이용하실 수 있습니다.'
    },
    en: {
      title: 'Service temporarily suspended',
      lead: 'MACHINE IQ services are temporarily suspended. You cannot use the service while it is suspended. We apologize for the inconvenience.',
      scopeLabel: 'Affected', scope: 'MACHINE IQ web',
      note: 'Once the service resumes, you can sign in again and continue as usual.'
    }
  };

  var lang = /^ko/i.test(navigator.language || 'ko') ? 'ko' : 'en';
  try { var saved = localStorage.getItem('miq.maintenance.lang'); if (saved === 'ko' || saved === 'en') lang = saved; } catch (e) {}

  function render() {
    var t = TEXT[lang];
    document.documentElement.lang = lang;
    document.title = (lang === 'ko' ? '서비스 일시 중단 안내' : 'Service temporarily suspended') + ' · MACHINE IQ';
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.getAttribute('data-t')]; });
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
  }

  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); try { localStorage.setItem('miq.maintenance.lang', lang); } catch (e) {} render(); });
  });
  render();
</script>
</body>
</html>

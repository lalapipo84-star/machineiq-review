<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MACHINE IQ 어드민</title>
  <script>
    // 첫 화면은 어드민 > 권한관리(고객정보관리). 어드민 화면은 role·portal 값이 있어야 열린다.
    const destination = new URL('Admin/customer-management.html', window.location.href);
    const params = new URLSearchParams(window.location.search);
    params.set('role', 'internal');
    params.set('portal', 'admin');
    destination.search = params.toString();
    window.location.replace(destination.href);
  </script>
</head>
<body><a href="Admin/customer-management.html?role=internal&amp;portal=admin">MACHINE IQ 어드민 열기</a></body>
</html>
